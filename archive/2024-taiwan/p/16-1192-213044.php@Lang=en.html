<script language="javascript">
function setFont(p_size,p_class) {
	var cookie = new Cookie();
   cookie.setCookie("FontSize",p_size,'1440',"/","",'1','Lax');
   $('.fontsize').prop('class','fontsize');
   $('.fontsize').attr('aria-pressed',false);
   if($.trim(p_class)=="")
      p_class = "mpgdetail";
   if(p_size == 'small' )  {
		$("#smallsize").prop("class","fontsize active");
		$("#smallsize").attr("aria-pressed",true);
      $('.'+p_class).removeClass('word-size-middle').removeClass('word-size-big').addClass('word-size-small');
   }else if(p_size == 'mid') {
		$("#midsize").prop("class","fontsize active");
		$("#midsize").attr("aria-pressed",true);
      $('.'+p_class).removeClass('word-size-small').removeClass('word-size-big');
   }else if(p_size == 'big') {
		$("#bigsize").prop("class","fontsize active");
		$("#bigsize").attr("aria-pressed",true);
      $('.'+p_class).removeClass('word-size-small').removeClass('word-size-middle').addClass('word-size-big');
   }
}
$(document).ready(function(){
   if(typeof ($(".mpgdetail").get(0))=="object") {
      $(".setfontsize").css("display","");
		var cookie = new Cookie();
      if(cookie.getCookie("FontSize")) {
         setFont(cookie.getCookie("FontSize"));
      }else {
         setFont('mid');
      }
   }
});
</script>

<script defer="defer">
$(document).ready(function(){
	$('.artctrl .addfav').click(function(){
		ptdetail_addfav();	
	});
  $('.share_btn').click(function(){
    $(this).siblings('.shareto').toggle();
  })
	function ptdetail_addfav(){
		if(popChkLogin()){
			if($(".artctrl .addfav").hasClass("active")){
				var url = "/app/index.php?Action=mobileaddtofav&Part=213044&Op=delfav";
			}else{
				var url = "/app/index.php?Action=mobileaddtofav&Part=213044&Op=addfav";
			}
			var a = [];
			$.post(url,a,function(data){
				d = eval("("+data+")");
				if(d.stat)
					$(".artctrl .addfav").addClass("active");
				else
					$(".artctrl .addfav").removeClass("active");
				mCallBack(data);
			});
		}
		else	showPopDiv($('#_pop_login.mpopdiv'),$('#_pop_login.mpopdiv .mbox'));
	}
	function ptdetail_chkfav(){
		var url = "/app/index.php?Action=mobileaddtofav&Part=213044&Op=chkfav";
		var a = [];
		$.post(url,a,function(data){
			d = eval("("+data+")");
			if(d.stat)
				$(".artctrl .addfav").addClass("active");
		});
	}
	ptdetail_chkfav();
	
		$.hajaxOpenUrl("/app/index.php?Action=mobilestsns",'.shareto');
	
	

	
});
</script>
