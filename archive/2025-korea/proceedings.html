<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proceedings - AsiaJCIS 2025</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #1e73be;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:hover {
      background-color: #155a96;
    }
  </style>
  <script>
    function verifyPassword() {
      const password = prompt("Enter password to download the proceedings:");
      if (password === "AsiaJCIS@2025") {
        window.location.href = "/AsiaJCIS_2025_proceedings.pdf";
      } else if (password !== null) {
        alert("Incorrect password. Please try again.");
      }
    }
	  
  </script>
</head>
<body>
  <h2>AsiaJCIS 2025 Proceedings</h2>
  <p>This ZIP file is protected. Please enter the password to download.</p>
  <button onclick="verifyPassword()">Download Proceedings ZIP</button>
</body>
</html>
